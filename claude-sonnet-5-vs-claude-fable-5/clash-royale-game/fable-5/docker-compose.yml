services:
  postgres:
    image: postgres:16-alpine
    container_name: arcane-towers-db
    environment:
      POSTGRES_USER: arcane
      POSTGRES_PASSWORD: arcane
      POSTGRES_DB: arcane_towers
    ports:
      - "5432:5432"
    volumes:
      - arcane_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcane -d arcane_towers"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  arcane_pgdata:
