[project]
name = "unsiloed-cli"
version = "0.1.0"
description = "UNSILOED CLI — agentic OCR & document processing in your terminal, built with LangChain + OpenAI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "langgraph>=0.2",
    "requests>=2.31",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.scripts]
unsiloed = "unsiloed_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unsiloed_cli"]
